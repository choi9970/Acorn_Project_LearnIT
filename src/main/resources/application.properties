spring.application.name=learnit

# ===============================
# Datasource
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# MyBatis
# ===============================
mybatis.type-aliases-package=com.learnit.learnit
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.java.sql=DEBUG

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Security / OAuth Logging
# ===============================
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.learnit.learnit.config=INFO
logging.level.com.learnit.learnit.user.service.OAuthService=INFO

# ===============================
# Google OAuth2
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v2/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# ===============================
# Kakao OAuth2
# ===============================
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize?prompt=select_account
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# ===============================
# Payment
# ===============================
portone.api.key=${PORTONE_API_KEY}
portone.api.secret=${PORTONE_API_SECRET}

kakao.pay.admin-key=${KAKAO_PAY_ADMIN_KEY}
kakao.pay.cid=${KAKAO_PAY_CID}

# ===============================
# Kakao Map
# ===============================
kakao.maps.js-key=${KAKAO_MAPS_JS_KEY}

# ===============================
# GitHub
# ===============================
github.api.token=${GITHUB_API_TOKEN}

# ===============================
# Mail
# ===============================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

mail.gmail.host=${GMAIL_HOST}
mail.gmail.port=${GMAIL_PORT}
mail.gmail.username=${GMAIL_USERNAME}
mail.gmail.password=${GMAIL_PASSWORD}

mail.naver.host=${NAVER_HOST}
mail.naver.port=${NAVER_PORT}
mail.naver.username=${NAVER_USERNAME}
mail.naver.password=${NAVER_PASSWORD}

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.file-size-threshold=2KB

# ===============================
# Judge0
# ===============================
rapid-api.key=${RAPID_API_KEY}
rapid-api.host=judge0-ce.p.rapidapi.com
rapid-api.url=https://judge0-ce.p.rapidapi.com/submissions?base64_encoded=false&wait=true

# ===============================
# Chatbot Agent
# ===============================
chatbot.agent.base-url=${CHATBOT_AGENT_BASE_URL}
chatbot.agent.chat-path=/api/chat
chatbot.agent.connect-timeout-ms=3000
chatbot.agent.read-timeout-ms=60000
chatbot.agent.retry.max-attempts=1
chatbot.agent.retry.backoff-ms=300

# ===============================
# AWS S3
# ===============================
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=ap-northeast-2
cloud.aws.stack.auto=false
cloud.aws.s3.bucket=${AWS_S3_BUCKET}

# ===============================
# App
# ===============================
app.base-url=${APP_BASE_URL}
server.forward-headers-strategy=framework
